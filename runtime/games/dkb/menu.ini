; Donkey Kong Bananza (program 040074A01BF12000, update 458752 exefs/main): the menu pointer's ui2d adapter
; (runtime/src/gfx/play/menu_ui2d.h), as data for the game module to load into its config. Offsets are in main (image base 0).
; Not tested in game: Bananza does not boot yet. Evidence for every value: runtime/docs/menu_pointer.md.
; The group update is hooked as an entry hook: recomp/games/dkb/main.sites needs `entryhook 0x71016ffabc` once the game is lifted.

[menu]
engine = ui2d
menu_mouse = 1
menu_log = 1
menu_in_game = 1

; ButtonGroup::UpdatePointer(group, const float pos[2] or null, bool trig, bool release, bool hold, bool from_pointer); vtable 0x23dc2e0 slot 2
ui2d_group_update = 0x16ffabc

; button group (72 bytes, made by 0x5e517c)
ui2d_grp_buttons = 8          ; intrusive list head {next, prev}; node at button +8
ui2d_grp_current = 40         ; the button the pointer is on (On), or null
ui2d_grp_flags = 64           ; u32, 3 at creation
ui2d_grp_pointer_bit = 0x2    ; the group takes the pointer

; button (NormalButton / DecisionButton / SelectButton / CheckButton ..., made by 0x5b0d9c, set up by 0x5b18c0)
ui2d_btn_node = 8
ui2d_btn_layout = 32          ; nn::ui2d::Layout*
ui2d_btn_flags = 64           ; u32
ui2d_btn_ready_mask = 0x220010   ; all set: the group's update tests it
ui2d_btn_hit = 88             ; the control's "Hit" pane

; nn::ui2d::Layout / nn::ui2d::Pane (SDK structures)
ui2d_lay_size = 40            ; float width, height
ui2d_pane_parent = 24
ui2d_pane_size = 80
ui2d_pane_flags = 88          ; bit 0 visible, bit 1 alpha reaches the children
ui2d_pane_alpha = 89
ui2d_pane_base = 91           ; base position: bits 0-1 horizontal, 2-3 vertical
ui2d_pane_mtx = 112           ; global matrix, 3x4 row-major
ui2d_pane_name = 176          ; char[24]
